<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="40" y="34" font-size="20" font-weight="700" fill="#0f172a">BizOwl Brief Desk</text>
  <text x="235" y="34" font-size="14" fill="#64748b">founder application in, anonymised investor brief out, a human approves</text>

  <!-- Inputs -->
  <rect x="40" y="70" width="200" height="80" rx="12" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="140" y="104" font-size="15" font-weight="600" text-anchor="middle" fill="#0f172a">WhatsApp community</text>
  <text x="140" y="126" font-size="13" text-anchor="middle" fill="#475569">400+ founders</text>

  <rect x="40" y="220" width="200" height="80" rx="12" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="140" y="254" font-size="15" font-weight="600" text-anchor="middle" fill="#0f172a">Fundraising form</text>
  <text x="140" y="276" font-size="13" text-anchor="middle" fill="#475569">bizzowl.com application</text>
  <line x1="140" y1="150" x2="140" y2="216" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="150" y="190" font-size="12" fill="#64748b">form link</text>

  <!-- Switch room -->
  <rect x="290" y="60" width="630" height="330" rx="16" fill="#f8fafc" stroke="#6366f1" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="310" y="88" font-size="15" font-weight="700" fill="#4338ca">#brief-desk on Discord · a Switch room</text>
  <text x="310" y="108" font-size="12" fill="#6366f1">4 Claude Code agents, handing off by mention</text>

  <g font-size="15" font-weight="600" text-anchor="middle" fill="#0f172a">
    <rect x="310" y="125" width="135" height="110" rx="12" fill="#e0e7ff" stroke="#6366f1"/>
    <text x="377" y="160">intake</text>
    <rect x="460" y="125" width="135" height="110" rx="12" fill="#e0e7ff" stroke="#6366f1"/>
    <text x="527" y="160">analyst</text>
    <rect x="610" y="125" width="135" height="110" rx="12" fill="#e0e7ff" stroke="#6366f1"/>
    <text x="677" y="160">privacy</text>
    <rect x="760" y="125" width="135" height="110" rx="12" fill="#e0e7ff" stroke="#6366f1"/>
    <text x="827" y="160">matcher</text>
  </g>
  <g font-size="12" text-anchor="middle" fill="#334155">
    <text x="377" y="184">checks fields</text>
    <text x="377" y="201">flags contradictions</text>
    <text x="377" y="218">drafts follow-ups</text>
    <text x="527" y="184" font-size="11" fill="#4338ca">role: brief-analyst</text>
    <text x="527" y="201">writes the</text>
    <text x="527" y="218">9-part brief</text>
    <text x="677" y="184" font-size="11" fill="#4338ca">role: privacy-reviewer</text>
    <text x="677" y="201">strips personal data</text>
    <text x="677" y="218">flags made-up claims</text>
    <text x="827" y="184">top 3 investors</text>
    <text x="827" y="201">drafts intro emails</text>
    <text x="827" y="218">waits for approve</text>
  </g>
  <line x1="445" y1="180" x2="456" y2="180" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="595" y1="180" x2="606" y2="180" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="745" y1="180" x2="756" y2="180" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <rect x="310" y="270" width="285" height="95" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="325" y="296" font-size="14" font-weight="600" fill="#0f172a">Room instructions</text>
  <text x="325" y="318" font-size="12" fill="#475569">Every agent reads them on joining:</text>
  <text x="325" y="336" font-size="12" fill="#475569">no founder personal details, no invented</text>
  <text x="325" y="354" font-size="12" fill="#475569">facts, nothing final without approve</text>

  <rect x="610" y="270" width="285" height="95" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="625" y="296" font-size="14" font-weight="600" fill="#0f172a">Room document</text>
  <text x="625" y="318" font-size="12" fill="#475569">investors.sample.csv: sectors, stages,</text>
  <text x="625" y="336" font-size="12" fill="#475569">cheque sizes and notes for each investor</text>
  <line x1="827" y1="270" x2="827" y2="240" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- form to intake, follow-up back -->
  <path d="M240 260 C 270 260, 280 200, 306 200" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <path d="M310 140 C 280 140, 270 110, 244 110" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="40" y="62" font-size="12" fill="#b45309">follow-up drafted, sent by a human</text>

  <!-- Human approval -->
  <rect x="960" y="125" width="200" height="110" rx="12" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="1060" y="160" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">Human approves</text>
  <text x="1060" y="185" font-size="12" text-anchor="middle" fill="#78350f">@matcher approve</text>
  <text x="1060" y="203" font-size="12" text-anchor="middle" fill="#78350f">Saffron only</text>
  <text x="1060" y="221" font-size="11" text-anchor="middle" fill="#92400e">only named investors count</text>
  <line x1="895" y1="180" x2="956" y2="180" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- Outputs -->
  <rect x="960" y="285" width="200" height="70" rx="12" fill="#dcfce7" stroke="#22c55e"/>
  <text x="1060" y="315" font-size="15" font-weight="600" text-anchor="middle" fill="#0f172a">outbox/</text>
  <text x="1060" y="337" font-size="12" text-anchor="middle" fill="#166534">approved brief and emails</text>

  <rect x="960" y="385" width="200" height="80" rx="12" fill="#dcfce7" stroke="#22c55e"/>
  <text x="1060" y="415" font-size="15" font-weight="600" text-anchor="middle" fill="#0f172a">#investor-outreach</text>
  <text x="1060" y="437" font-size="12" text-anchor="middle" fill="#166534">linked Switch room</text>
  <text x="1060" y="454" font-size="12" text-anchor="middle" fill="#166534">audit trail: who approved</text>
  <line x1="1060" y1="235" x2="1060" y2="281" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <path d="M1160 180 C 1195 180, 1195 425, 1164 425" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- Footer -->
  <rect x="40" y="500" width="1120" height="70" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="60" y="528" font-size="13" fill="#334155">Runs on one laptop: Switch Console with a local Switch server and four Claude Code agents, bridged to Discord.</text>
  <text x="60" y="550" font-size="13" fill="#334155">Applications that start with REAL: stay in private/ end to end (git-ignored) and are never posted to the live demo rooms.</text>
</svg>
